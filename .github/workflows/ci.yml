name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel duplicate runs on the same branch (push then PR open) to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repo well-formedness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Step 1: All JSON files must parse
      # ---------------------------------------------------------------
      - name: JSON syntax validation
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::Invalid JSON"
              fail=1
            else
              echo "ok  $f"
            fi
          done < <(find . \
              -path ./node_modules -prune -o \
              -path ./.git -prune -o \
              -name '*.json' -print0)
          exit $fail

      # ---------------------------------------------------------------
      # Step 2: plugin.json must declare its required top-level fields
      # ---------------------------------------------------------------
      - name: plugin.json schema sanity
        run: |
          python3 - <<'PY'
          import json, sys
          required = {"name", "displayName", "version", "license", "profiles"}
          p = json.load(open("plugin.json", encoding="utf-8"))
          missing = required - p.keys()
          if missing:
              print(f"::error file=plugin.json::Missing required fields: {missing}")
              sys.exit(1)
          if not p["name"]:
              print("::error file=plugin.json::name is empty")
              sys.exit(1)
          if "available" not in p["profiles"]:
              print("::error file=plugin.json::profiles.available list missing")
              sys.exit(1)
          print(f"plugin.json OK — {p['name']} v{p['version']}, {len(p['profiles']['available'])} profiles available")
          PY

      # ---------------------------------------------------------------
      # Step 3: Each profile.json declared in plugin.json must exist
      #          and reference files that exist
      # ---------------------------------------------------------------
      - name: Profile manifests vs filesystem
        run: |
          python3 - <<'PY'
          import json, os, sys
          p = json.load(open("plugin.json", encoding="utf-8"))
          fail = False
          for name in p["profiles"]["available"]:
              pj = f"profiles/{name}/profile.json"
              if not os.path.isfile(pj):
                  print(f"::error file=plugin.json::profile {name!r} listed but {pj} missing")
                  fail = True
                  continue
              prof = json.load(open(pj, encoding="utf-8"))
              for kind, dirname in [("agents","agents"),("skills","skills"),("knowHow","know-how"),("hooks","hooks")]:
                  for item in prof.get(kind, []):
                      path = f"profiles/{name}/{dirname}/{item}.md"
                      if not os.path.isfile(path):
                          print(f"::error file={pj}::{kind} entry {item!r} but {path} not found")
                          fail = True
              print(f"ok  profiles/{name}")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------
      # Step 4: Markdown frontmatter sanity for agents and commands
      # Uses real YAML parsing (PyYAML) — not string grep — to avoid
      # false negatives when key names appear inside markdown bodies.
      # ---------------------------------------------------------------
      - name: Install PyYAML for frontmatter parsing
        run: pip install --quiet pyyaml

      - name: Agent / command markdown frontmatter
        run: |
          python3 - <<'PY'
          import os, sys, glob, yaml
          fail = False
          rules = {
              "core/agents/*.md":            ["name", "description", "model"],
              "profiles/*/agents/*.md":      ["name", "description", "model"],
              "core/commands/*.md":          ["name", "description", "allowed-tools"],
              "core/skills/*.md":            ["name", "description"],
              "profiles/*/skills/*.md":      ["name", "description"],
          }
          for pattern, required in rules.items():
              for f in glob.glob(pattern):
                  if os.path.basename(f).startswith("_"):
                      continue
                  with open(f, encoding="utf-8") as fp:
                      content = fp.read()
                  if not content.startswith("---"):
                      print(f"::error file={f}::missing YAML frontmatter")
                      fail = True
                      continue
                  # Extract the frontmatter block between the first two '---' lines
                  parts = content.split("---", 2)
                  if len(parts) < 3:
                      print(f"::error file={f}::frontmatter not closed (no second '---')")
                      fail = True
                      continue
                  try:
                      fm = yaml.safe_load(parts[1]) or {}
                  except yaml.YAMLError as e:
                      print(f"::error file={f}::frontmatter is not valid YAML: {e}")
                      fail = True
                      continue
                  if not isinstance(fm, dict):
                      print(f"::error file={f}::frontmatter must be a YAML mapping (got {type(fm).__name__})")
                      fail = True
                      continue
                  for key in required:
                      if key not in fm:
                          print(f"::error file={f}::frontmatter missing required field {key!r}")
                          fail = True
                  print(f"ok  {f}")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------
      # Step 5: install.sh syntax must be POSIX-bash compatible
      # ---------------------------------------------------------------
      - name: install.sh syntax (bash -n)
        run: bash -n adapters/claude-code/install.sh

      # ---------------------------------------------------------------
      # Step 6: Confirm no bash 4+ feature regressed in
      # ---------------------------------------------------------------
      - name: install.sh — no bash 4+ syntax
        run: |
          if grep -nE '\$\{[a-zA-Z_]+,,\}|\$\{[a-zA-Z_]+\^\^\}|declare -A|mapfile' adapters/claude-code/install.sh; then
            echo "::error file=adapters/claude-code/install.sh::bash 4+ feature found — must stay POSIX bash 3.2 compatible (macOS default)"
            exit 1
          fi
          echo "ok  install.sh stays bash 3.2-compatible"

      # ---------------------------------------------------------------
      # Step 7: profile.json schema sanity — every profile manifest
      # must declare the fields install.sh + adapters expect to read
      # ---------------------------------------------------------------
      - name: profile.json schema sanity
        run: |
          python3 - <<'PY'
          import json, glob, sys
          required = {
              "name", "displayName", "version", "description",
              "extends-core", "applicableTo", "tags",
              "agents", "skills", "knowHow", "hooks",
          }
          list_fields = {"agents", "skills", "knowHow", "hooks",
                         "applicableTo", "tags"}
          fail = False
          for pj in sorted(glob.glob("profiles/*/profile.json")):
              data = json.load(open(pj, encoding="utf-8"))
              missing = required - data.keys()
              if missing:
                  print(f"::error file={pj}::missing required fields: "
                        f"{sorted(missing)}")
                  fail = True
              for k in list_fields:
                  if k in data and not isinstance(data[k], list):
                      print(f"::error file={pj}::{k!r} must be a list, "
                            f"got {type(data[k]).__name__}")
                      fail = True
              if "extends-core" in data and not isinstance(
                      data["extends-core"], bool):
                  print(f"::error file={pj}::extends-core must be a boolean")
                  fail = True
              print(f"ok  {pj}")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------
      # Step 8: Orphan detection — every .md file in profiles/<X>/agents,
      # /skills, /know-how, /hooks must be listed in that profile's
      # profile.json. Catches forgotten manifest updates after add/rename.
      # Files starting with "_" (e.g. _templates) are exempt.
      # ---------------------------------------------------------------
      - name: Profile filesystem vs manifest (orphan check)
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          kind_to_dir = {"agents": "agents", "skills": "skills",
                         "knowHow": "know-how", "hooks": "hooks"}
          fail = False
          for pj in sorted(glob.glob("profiles/*/profile.json")):
              data = json.load(open(pj, encoding="utf-8"))
              prof_dir = os.path.dirname(pj)
              for kind, dirname in kind_to_dir.items():
                  listed = set(data.get(kind, []))
                  d = os.path.join(prof_dir, dirname)
                  if not os.path.isdir(d):
                      continue
                  on_disk = {
                      os.path.splitext(f)[0]
                      for f in os.listdir(d)
                      if f.endswith(".md") and not f.startswith("_")
                  }
                  for orphan in sorted(on_disk - listed):
                      path = f"{d}/{orphan}.md"
                      print(f"::error file={path}::file present but not "
                            f"listed in {pj}'s {kind!r} array")
                      fail = True
                  print(f"ok  {prof_dir}/{dirname} "
                        f"({len(on_disk)} on disk, {len(listed)} in manifest)")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------
      # Step 9: Markdown internal link validation — catches broken
      # cross-references that piecewise renames create. External URLs,
      # mailto:, and anchor-only (#section) links are skipped. Code
      # blocks and inline code are stripped before scanning to avoid
      # false positives on syntax examples.
      # ---------------------------------------------------------------
      - name: Markdown internal link check
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          REPO = Path(".").resolve()
          EXCLUDE = {".git", "node_modules", ".claude"}
          LINK_RE = re.compile(
              r'!?\[([^\]]*)\]\(\s*([^\s)]+)'
              r'(?:\s+"[^"]*"|\s+\'[^\']*\')?\s*\)'
          )
          fail = False
          checked = 0
          for root, dirs, files in os.walk(REPO):
              dirs[:] = [d for d in dirs if d not in EXCLUDE]
              for f in files:
                  if not f.endswith(".md"):
                      continue
                  md = Path(root) / f
                  rel = md.relative_to(REPO)
                  text = md.read_text(encoding="utf-8", errors="replace")
                  text = re.sub(r"```.*?```", "", text, flags=re.DOTALL)
                  text = re.sub(r"`[^`\n]+`", "", text)
                  for _, target in LINK_RE.findall(text):
                      if re.match(r"^[a-zA-Z][a-zA-Z0-9+\-.]*:", target):
                          continue
                      if target.startswith("#") or target.startswith("//"):
                          continue
                      path_part = target.split("#", 1)[0].split("?", 1)[0]
                      if not path_part:
                          continue
                      resolved = (md.parent / path_part).resolve()
                      try:
                          resolved.relative_to(REPO)
                      except ValueError:
                          print(f"::error file={rel}::link escapes repo "
                                f"root: {target}")
                          fail = True
                          continue
                      if not resolved.exists():
                          rel_resolved = resolved.relative_to(REPO)
                          print(f"::error file={rel}::broken link "
                                f"{target!r} -> {rel_resolved}")
                          fail = True
                      checked += 1
          print(f"checked {checked} internal markdown links")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------
      # Step 10c: Run inheritance resolver golden-file tests. 13 cases
      # under tests/extends/, each one a fixture pinning down a specific
      # behaviour or failure mode of the resolver.
      # ---------------------------------------------------------------
      - name: Profile extends — resolver fixtures
        run: python3 tests/extends/run.py

      # ---------------------------------------------------------------
      # Step 11: Explainer auto-section drift check. The stat panel
      # in docs/explainers/01-架構總覽.html is regenerated from
      # plugin.json + filesystem counts. Fail the build if the
      # committed HTML doesn't match what the generator produces —
      # i.e., someone added a new agent/skill/etc. without re-running
      # the generator.
      # ---------------------------------------------------------------
      - name: Explainer auto-sections — drift check
        run: python3 scripts/regen_explainers.py --check

      # ---------------------------------------------------------------
      # Step 12: Multi-profile pairwise conflict scan. For every
      # unordered pair of profiles in plugin.json's `profiles.available`
      # list, run the conflict scanner. Fail if any pair shares a
      # `<kind>/<basename>.md`. This catches the case where two
      # contributors independently land profile changes that would
      # silently collide pairwise.
      # ---------------------------------------------------------------
      - name: Multi-profile — pairwise conflict scan
        run: python3 adapters/claude-code/_multiprofile.py scan-all

      # ---------------------------------------------------------------
      # Step 13: Multi-profile helper unit tests. Exercises scan_set,
      # scan_pair, and aggregate_profiles against synthetic mini-repos
      # and asserts behavior. Also includes a check that the real
      # repo's profile pairs scan clean.
      # ---------------------------------------------------------------
      - name: Multi-profile — helper unit tests
        run: python3 tests/multiprofile/test_multiprofile.py

      # ---------------------------------------------------------------
      # Step 10a: Profile inheritance — lint every `extends:` profile
      # file. Validates extends path, mode marker presence (exactly
      # one of <!-- inherit --> or <!-- override-body -->),
      # replace-section heading existence, and frontmatter
      # post-merge requirements. See spec §10.1.
      # ---------------------------------------------------------------
      - name: Profile extends — lint
        run: |
          python3 - <<'PY'
          import os, sys, glob, subprocess
          resolver = "adapters/claude-code/_resolve_extends.py"
          fail = False
          checked = 0
          for f in sorted(glob.glob("profiles/*/**/*.md", recursive=True)):
              # Skip _templates
              if any(p.startswith("_") for p in f.replace("\\","/").split("/")):
                  continue
              try:
                  with open(f, encoding="utf-8") as fp:
                      text = fp.read()
              except OSError:
                  continue
              if not text.startswith("---"):
                  continue
              parts = text.split("---", 2)
              if len(parts) < 3:
                  continue
              fm_block = parts[1]
              if "\nextends:" not in "\n" + fm_block:
                  continue
              proc = subprocess.run(
                  ["python3", resolver, "--repo-root", ".", "lint", f],
                  capture_output=True, text=True,
              )
              if proc.returncode != 0:
                  sys.stdout.write(proc.stderr)
                  fail = True
              else:
                  print(f"ok  {f}")
              checked += 1
          print(f"checked {checked} profile files with `extends:`")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------
      # Step 10b: Core-side heading-anchor protection. When a PR
      # touches core/<kind>/*.md, diff the `## ` headings against the
      # base. For any removed/renamed heading, fail if any profile's
      # `<!-- replace-section: <heading> -->` still references it
      # without the same PR also updating that profile. Spec §10.2.
      # ---------------------------------------------------------------
      - name: Profile extends — core heading-anchor protection
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # Need full base history for the diff
          git fetch --no-tags --depth=1 origin "${BASE_SHA}" || true
          changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" \
            -- 'core/*/**.md' || true)
          if [[ -z "${changed}" ]]; then
            echo "no core/ markdown files touched — skip"
            exit 0
          fi
          touched_profiles=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" \
            -- 'profiles/*/**.md' || true)
          fail=0
          while IFS= read -r core_file; do
            [[ -z "${core_file}" ]] && continue
            base_headings=$(git show "${BASE_SHA}:${core_file}" 2>/dev/null \
              | grep -E '^## ' | sed 's/^## //' || true)
            head_headings=$(grep -E '^## ' "${core_file}" \
              | sed 's/^## //' || true)
            removed=$(comm -23 \
              <(printf '%s\n' "${base_headings}" | sort -u) \
              <(printf '%s\n' "${head_headings}" | sort -u) | sed '/^$/d')
            if [[ -z "${removed}" ]]; then
              echo "ok  ${core_file} (no removed headings)"
              continue
            fi
            # For each removed heading, check if profiles still reference
            while IFS= read -r heading; do
              [[ -z "${heading}" ]] && continue
              python3 adapters/claude-code/_resolve_extends.py \
                --repo-root . lint-anchors "${core_file}" "${heading}" \
                || fail=1
              # Check if any profile that references this heading is
              # also being updated in the same PR (acceptable case)
              referencing=$(python3 -c "
          import sys
          sys.path.insert(0, 'adapters/claude-code')
          import _resolve_extends as r
          from pathlib import Path
          for p, _ in r.find_referencing_profiles(
                  Path('.'), Path('${core_file}'), ['${heading}']):
              print(p)
          " 2>/dev/null || true)
              while IFS= read -r ref_path; do
                [[ -z "${ref_path}" ]] && continue
                if ! grep -qF "${ref_path}" <<< "${touched_profiles}"; then
                  echo "::error file=${core_file}::removed heading '## ${heading}' is referenced by ${ref_path} which is NOT updated in this PR"
                fi
              done <<< "${referencing}"
            done <<< "${removed}"
          done <<< "${changed}"
          exit $fail

      # ---------------------------------------------------------------
      # Step 14: Registration guardrail. An unregistered profiles/<dir>
      # is silently skipped by Step 3 (manifest vs filesystem), Step 11
      # (explainer stat panel) and Step 12 (pairwise conflict scan), so
      # CI would stay green while the profile is invisible. Every
      # profiles/<dir>/ (dirs starting with "_" are exempt) must be in
      # plugin.json `profiles.available`, and its `status` (missing
      # = complete) must match the plugin.json list that names it.
      # ---------------------------------------------------------------
      - name: Profiles — every profiles/<dir> is registered in plugin.json
        run: |
          python3 - <<'PY'
          import json, os, sys
          plugin = json.load(open("plugin.json", encoding="utf-8"))
          reg = plugin["profiles"]
          available = set(reg.get("available", []))
          status_lists = {k: set(reg.get(k, [])) for k in ("complete", "alpha", "stub")}
          fail = False
          dirs = sorted(
              d for d in os.listdir("profiles")
              if os.path.isdir(os.path.join("profiles", d)) and not d.startswith("_")
          )
          for d in dirs:
              pj = f"profiles/{d}/profile.json"
              if d not in available:
                  print(f"::error file=plugin.json::profiles/{d}/ exists but is not in "
                        f"profiles.available — it is silently skipped by the pairwise "
                        f"conflict scan and the explainer stats. Register it (see "
                        f"docs/profile-development.md).")
                  fail = True
              if not os.path.isfile(pj):
                  print(f"::error file=profiles/{d}::directory has no profile.json")
                  fail = True
                  continue
              status = json.load(open(pj, encoding="utf-8")).get("status", "complete")
              if status not in status_lists:
                  print(f"::error file={pj}::status {status!r} is not one of "
                        f"complete / alpha / stub")
                  fail = True
              elif d not in status_lists[status]:
                  print(f"::error file=plugin.json::{d} has status {status!r} in "
                        f"{pj} but is not listed in plugin.json profiles.{status}")
                  fail = True
              others = [k for k, v in status_lists.items() if d in v and k != status]
              if others:
                  print(f"::error file=plugin.json::{d} (status {status!r}) is also "
                        f"listed under profiles.{others}")
                  fail = True
          for name in sorted(available - set(dirs)):
              print(f"::error file=plugin.json::profiles.available lists {name!r} "
                    f"but profiles/{name}/ does not exist")
              fail = True
          for key, names in status_lists.items():
              for name in sorted(names - available):
                  print(f"::error file=plugin.json::profiles.{key} lists {name!r} "
                        f"which is not in profiles.available")
                  fail = True
          default = reg.get("default")
          if default and default not in available:
              print(f"::error file=plugin.json::profiles.default {default!r} is not "
                    f"in profiles.available")
              fail = True
          print(f"{len(dirs)} profile dirs, {len(available)} registered")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------
      # Step 15: Agent tool allowlist (least privilege). Every agent
      # (core/**/agents, profiles/**/agents) and every profile
      # _templates/agent-*.md starter must declare `tools:` and keep it
      # inside ALLOWED. Bash is opt-in per agent: the body must contain
      #   <!-- tools: bash-justified: <reason> -->
      # Starters under _templates/ may never opt in (they get copied).
      # Read-only MCP tools of the reference scheduler server are also
      # allowed, by prefix: `mcp__manufacturing-scheduler__<tool>` (the
      # concrete tool names are pinned by tests/mcp). Any other MCP
      # server prefix has to be added to MCP_PREFIXES in its own PR.
      # WebFetch / Write / Edit etc. are not allowed at all — widen
      # ALLOWED / OPT_IN / MCP_PREFIXES below only in a PR that
      # discusses why.
      # ---------------------------------------------------------------
      - name: Agents — tool allowlist
        run: |
          python3 - <<'PY'
          import glob, re, sys, yaml
          ALLOWED = {"Read", "Grep", "Glob"}
          OPT_IN = {"Bash"}   # allowed only with the bash-justified marker
          MCP_PREFIXES = ("mcp__manufacturing-scheduler__",)  # read-only scheduler tools
          MARKER = re.compile(r"<!--\s*tools:\s*bash-justified:\s*\S[^>]*?-->")
          files = sorted(set(
              glob.glob("core/**/agents/*.md", recursive=True)
              + glob.glob("profiles/**/agents/*.md", recursive=True)
              + glob.glob("profiles/**/_templates/agent-*.md", recursive=True)
          ))
          fail = False
          for f in files:
              text = open(f, encoding="utf-8").read()
              parts = text.split("---", 2)
              if not text.startswith("---") or len(parts) < 3:
                  continue  # Step 4 reports missing / unclosed frontmatter
              try:
                  fm = yaml.safe_load(parts[1]) or {}
              except yaml.YAMLError:
                  continue  # Step 4 reports invalid YAML
              if "tools" not in fm:
                  print(f"::error file={f}::agent must declare `tools:` "
                        f"(omitting it inherits every tool); use [Read, Grep, Glob]")
                  fail = True
                  continue
              raw = fm["tools"]
              tools = ({t.strip() for t in raw.split(",") if t.strip()}
                       if isinstance(raw, str) else {str(t) for t in (raw or [])})
              is_template = "/_templates/" in f
              has_marker = bool(MARKER.search(parts[2]))
              bad = sorted(t for t in tools - ALLOWED - OPT_IN
                           if not t.startswith(MCP_PREFIXES))
              if bad:
                  print(f"::error file={f}::tools {bad} are not on the allowlist "
                        f"{sorted(ALLOWED)} (+ Bash with a justification marker, "
                        f"+ {list(MCP_PREFIXES)} tools)")
                  fail = True
              if tools & OPT_IN:
                  if is_template:
                      print(f"::error file={f}::starter templates must not declare "
                            f"{sorted(tools & OPT_IN)}; contributors copy this file")
                      fail = True
                  elif not has_marker:
                      print(f"::error file={f}::declares Bash but the body has no "
                            f"`<!-- tools: bash-justified: <reason> -->` marker")
                      fail = True
              elif has_marker:
                  print(f"::error file={f}::has a bash-justified marker but does not "
                        f"declare Bash in `tools:` — remove the stale marker")
                  fail = True
              print(f"ok  {f}  tools={sorted(tools)}")
          print(f"checked {len(files)} agent files")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------
      # Step 16: Explainer 01 overlay rows vs stat panel. Step 11 only
      # regenerates the stat panel; the agent / know-how / hook overlay
      # rows (and their "CNC a + alpha α b" labels) are hand-edited.
      # Count the item tiles per row and compare with (1) the label and
      # (2) the regenerated stat numbers, so adding a profile cannot
      # leave the rows stale. Skills have no row in explainer 01.
      # ---------------------------------------------------------------
      - name: Explainer 01 — overlay rows vs stat panel
        run: |
          python3 - <<'PY'
          import glob, re, sys
          path = glob.glob("docs/explainers/01-*.html")[0]
          html = open(path, encoding="utf-8").read()
          stats = html[html.index("AUTO-START: explainer01-stats"):html.index("AUTO-END")]
          def stat(label, with_alpha=True):
              m = re.search(label + r"（(\d+) \+ (\d+)(?: \+ (\d+)α)?）", stats)
              if not m:
                  print(f"::error file={path}::cannot find stat line {label!r}")
                  sys.exit(1)
              return int(m[1]), int(m[2]), int(m[3] or 0)
          expected = {            # layer marker -> (stat label, noun)
              "ROLE": ("Agents", "agent"),
              "REF":  ("Know-how", "know-how"),
              "HOOK": ("Hooks", "hook"),
          }
          fail = False
          for layer, (label, noun) in expected.items():
              m = re.search(r"<!-- LAYER \d+ " + layer + r" -->(.*?)(?=<!-- LAYER |\Z)",
                            html, re.S)
              if not m:
                  print(f"::error file={path}::LAYER {layer} block not found")
                  fail = True
                  continue
              core_html, _, overlay_html = m[1].partition('class="layer-overlay"')
              n_core = len(re.findall(r'<div class="item(?: new)?">', core_html))
              n_cnc = len(re.findall(r'<div class="item cnc">', overlay_html))
              n_alpha = len(re.findall(r'<div class="item alpha">', overlay_html))
              s_core, s_cnc, s_alpha = stat(label)
              o_label = re.search(r'col-label profile">([^<]*)<', overlay_html)[1]
              c_label = re.search(r'col-label">([^<]*)<', core_html)[1]
              l_core = int(re.search(r"(\d+)", c_label)[1])
              l_cnc = int((re.search(r"CNC (\d+)", o_label) or [0, 0])[1])
              l_alpha = int((re.search(r"α (\d+)", o_label) or [0, 0])[1])
              rows = [
                  ("core", n_core, s_core, l_core, c_label),
                  ("CNC", n_cnc, s_cnc, l_cnc, o_label),
                  ("alpha", n_alpha, s_alpha, l_alpha, o_label),
              ]
              for what, n, s, l, text in rows:
                  if n != s or l != s:
                      print(f"::error file={path}::{layer} row, {what} {noun}s: "
                            f"{n} tiles, label says {l} ({text.strip()!r}), stat panel "
                            f"says {s} — hand-edit the overlay row/label after "
                            f"`python3 scripts/regen_explainers.py`")
                      fail = True
              print(f"{layer}: tiles core/cnc/alpha = {n_core}/{n_cnc}/{n_alpha}; "
                    f"stat = {s_core}/{s_cnc}/{s_alpha}")
          sys.exit(1 if fail else 0)
          PY
