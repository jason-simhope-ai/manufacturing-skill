# De-identification cases (deid.py). `input`/`output` are CSV text; `map` and
# `denylist` are the local files (null = absent). expect.stdout lists
# substrings; expect.map lists substrings of the rewritten map file.
deid:
  - id: customers-become-stable-ids-and-columns-drop
    input: |
      customer,part,desc,inspector
      Foo Corp,PN-EX-0001,burr on edge,inspector-a
      Bar Ltd,PN-EX-0002,Foo Corp asked about it,inspector-b
      Foo Corp,PN-EX-0003,scratch,inspector-a
    args: ["--drop", "inspector"]
    expect:
      exit: 0
      output: |
        customer,part,desc
        CUST-01,PN-EX-0001,burr on edge
        CUST-02,PN-EX-0002,CUST-01 asked about it
        CUST-01,PN-EX-0003,scratch
      stdout: ["customers replaced=3", "in-text=1", "columns dropped=1", "residual hits=0"]
      map: ["Foo Corp: CUST-01", "Bar Ltd: CUST-02"]
  - id: existing-map-is-reused-and-extended
    map: "schema: 1\ncustomers:\n  Foo Corp: CUST-07\n"
    input: |
      customer,desc
      Foo Corp,a
      New Co,b
    args: []
    expect:
      exit: 0
      output: |
        customer,desc
        CUST-07,a
        CUST-08,b
      map: ["New Co: CUST-08", "Foo Corp: CUST-07"]
  - id: keep-limits-columns
    input: |
      customer,part,desc,secret_note
      Foo Corp,PN-EX-0001,burr,private
    args: ["--keep", "customer,part"]
    expect:
      exit: 0
      output: |
        customer,part
        CUST-01,PN-EX-0001
  - id: residual-confidential-word-blocks-output
    input: |
      customer,desc
      Foo Corp,此為機密圖面
    args: []
    expect: { exit: 1, output: null, stdout: ["residual hits=1", "confidential-word"] }
  - id: residual-denylist-pattern-blocks-output
    denylist: "# project codes\nDWG-\\d+\n"
    input: |
      customer,desc
      Foo Corp,see DWG-12345 for details
    args: []
    expect: { exit: 1, output: null, stdout: ["denylist"] }
  - id: residual-national-id-and-amount
    input: |
      customer,desc
      Foo Corp,"id A123456789 paid NT$ 12,000"
    args: []
    expect: { exit: 1, output: null, stdout: ["tw-national-id", "nt-amount"] }
  - id: residual-business-id-with-valid-checksum
    input: |
      customer,desc
      Foo Corp,tax id 10000004 on invoice
    args: []
    expect: { exit: 1, output: null, stdout: ["tw-business-id"] }
  - id: eight-digit-number-with-bad-checksum-is-not-flagged
    input: |
      customer,desc
      Foo Corp,lot 10000001 shipped
    args: []
    expect: { exit: 0, output: "customer,desc\nCUST-01,lot 10000001 shipped\n" }
  - id: text-option-limits-the-scan
    input: |
      customer,desc,memo
      Foo Corp,fine,此為機密
    args: ["--text", "desc"]
    expect: { exit: 0, output: "customer,desc,memo\nCUST-01,fine,此為機密\n" }
  - id: missing-input-file-is-usage-error
    input: null
    args: []
    expect: { exit: 2, output: null }
