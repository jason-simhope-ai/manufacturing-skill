cases:
  # ---- baseline and modes ------------------------------------------------
  - id: base-ci-green
    args: [check, --ci]
    expect: { exit: 0, codes: [], contains: ["outsource: enabled 0 / dormant 1", "teamctl check [ci]: OK"] }
  - id: base-local-green
    args: [check]
    expect: { exit: 0, codes: [] }
  - id: base-strict-green
    args: [check, --strict]
    expect: { exit: 0, codes: [] }
  - id: usage-missing-roster-exit-2
    args: [check, --roster, no-such-roster.yaml]
    expect: { exit: 2, codes: [] }
  - id: usage-bad-today-exit-2
    args: [check, --today, not-a-date]
    expect: { exit: 2, codes: [] }
  - id: usage-unknown-subcommand-exit-2
    args: [frobnicate]
    expect: { exit: 2, codes: [] }

  # ---- E001-E005 structure ----------------------------------------------
  - id: e001-yaml-syntax
    replace:
      team/roster.example.yaml: [["schema: 1\n", "schema: [1\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E001] }
  - id: e001-root-not-mapping
    files:
      team/roster.example.yaml: "- just\n- a list\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E001] }
  - id: e001-duplicate-key
    replace:
      team/roster.example.yaml: [["schema: 1\n", "schema: 1\nschema: 1\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E001] }
  - id: e002-unknown-roster-key
    replace:
      team/roster.example.yaml: [["schema: 1\n", "schema: 1\nsurprise: true\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E002] }
  - id: e002-unknown-capability-key
    replace:
      team/twins/qa-manager.md: [["    category: strengthen\n", "    category: strengthen\n    priority: high\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E002] }
  - id: e003-missing-required
    replace:
      team/roster.example.yaml: [[", timezone: Asia/Taipei", ""]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E003] }
  - id: e003-example-without-synthetic
    replace:
      team/roster.example.yaml: [["synthetic: true\n", ""]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E003] }
  - id: e003-required-file-missing
    files:
      team/policies/restricted.md: null
    args: [check, --ci]
    expect: { exit: 1, codes: [E003] }
  - id: e004-bad-enum
    replace:
      team/roster.example.yaml: [["saasTierCeiling: T1", "saasTierCeiling: T9"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E004] }
  - id: e004-dangling-reference
    replace:
      team/roster.example.yaml: [["head: qa-manager,", "head: ghost-head,"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E004] }
  - id: e004-profile-not-in-plugin
    replace:
      team/roster.example.yaml: [["profiles: [cnc-machining]", "profiles: [made-up-profile]"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E004] }
  - id: e005-sexagesimal-int-for-string
    replace:
      team/roster.example.yaml: [["displayName: 測試公司", "displayName: 7:40"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E005] }
  - id: e005-bad-date-format
    replace:
      team/roster.example.yaml: [['reviewedOn: "2026-09-20"', 'reviewedOn: "2026-9-1"']]
    args: [check, --ci]
    expect: { exit: 1, codes: [E005] }
  - id: iso-date-normalised-ok
    replace:
      team/roster.example.yaml: [['reviewedOn: "2026-09-20"', 'reviewedOn: 2026-09-20']]
    args: [check, --ci]
    expect: { exit: 0, codes: [] }

  # ---- E010-E014 repo hygiene -------------------------------------------
  - id: e010-incumbent-not-local-or-vacant
    replace:
      team/roster.example.yaml: [["incumbent: LOCAL\n", "incumbent: contractor\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E010] }
  - id: e011-identity-key-in-roster
    replace:
      team/roster.example.yaml: [["title: 董事長室主管,", "title: 董事長室主管, holder: someone,"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E011] }
  - id: e011-identity-key-in-twin
    replace:
      team/twins/qa-manager.md: [["title: 品保部主管分身\n", "title: 品保部主管分身\nemail: someone\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E011] }
  - id: e012-surname-plus-title
    files:
      team/notes.md: "@@ZH_NAME@@ 說他會處理。\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E012] }
  - id: e012-not-flagged-after-cjk
    files:
      team/notes.md: "雙方工程師會討論。\n"
    args: [check, --ci]
    expect: { exit: 0, codes: [] }
  - id: e013-slack-token-anywhere
    files:
      docs/notes.md: "token: @@SLACK_TOKEN@@\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E013] }
  - id: e013-aws-key
    files:
      scripts/x.txt: "key @@AWS_KEY@@\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E013] }
  - id: e013-generic-assignment-in-team
    files:
      team/notes.yaml: "password: abcdefghijklmnop1234\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E013] }
  - id: e014-email-outside-example-domain
    files:
      team/notes.md: "contact @@EMAIL@@ now\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E014] }
  - id: e014-email-example-domain-ok
    files:
      team/notes.md: "contact ops@example.com now\n"
    args: [check, --ci]
    expect: { exit: 0, codes: [] }
  - id: e014-mobile
    files:
      examples/notes.md: "call @@MOBILE@@\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E014] }
  - id: e014-platform-ids-and-honorific
    files:
      TEAM.md: "@@SLACK_ID@@ and @@DISCORD_ID@@ and @@HONORIFIC@@\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E014] }
  - id: lint-allow-suppresses-false-positive
    files:
      team/notes.md: "ZEBRAXYZ12 appears here\n"
      team/tools/lint-allow.txt: "ZEBRAXYZ12 # fixture: a harmless all-caps word\n"
    args: [check, --ci]
    expect: { exit: 0, codes: [] }
  - id: lint-allow-without-reason-is-error
    files:
      team/tools/lint-allow.txt: "ZEBRAXYZ12\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E003] }

  # ---- E020-E024 twin files ----------------------------------------------
  - id: e020-twin-file-missing
    files:
      team/twins/qa-manager.md: null
    args: [check, --ci]
    expect: { exit: 1, codes: [E020] }
  - id: e020-id-differs-from-filename
    replace:
      team/twins/qa-manager.md: [["id: qa-manager\n", "id: qa-lead\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E020] }
  - id: e021-id-collides-with-agent-basename
    files:
      core/agents/qa-manager.md: "---\nname: qa-manager\ndescription: x\nmodel: sonnet\n---\n\nbody\n"
    args: [check, --ci]
    expect: { exit: 1, codes: [E021] }
  - id: e022-forbidden-keys
    replace:
      team/twins/qa-manager.md: [["kind: twin\n", "kind: twin\ntools: [Read]\nmodel: opus\nextends: core/agents/quality-inspector\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E022] }
  - id: e023-unresolvable-compose-id
    replace:
      team/twins/qa-manager.md: [["skills: [spc-basics]", "skills: [no-such-skill]"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E023] }
  - id: e023-path-traversal-id-rejected
    replace:
      team/twins/qa-manager.md: [["skills: [spc-basics]", "skills: ['../agents/quality-inspector']"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E023] }
  - id: e024-missing-section
    replace:
      team/twins/qa-manager.md: [["## 回覆格式\n", "## 格式\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E024] }
  - id: e024-missing-safety-sentence
    replace:
      team/twins/qa-manager.md: [["- 沒有工具結果就不聲稱已做。\n", ""]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E024] }

  # ---- E030-E039 capabilities and outsource ------------------------------
  - id: e030-category-missing
    replace:
      team/twins/qa-manager.md: [["    category: strengthen\n", ""]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E030] }
  - id: e030-category-unknown
    replace:
      team/twins/qa-manager.md: [["category: strengthen", "category: automate"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E030] }
  - id: e031-outsource-not-dormant
    replace:
      team/twins/qa-manager.md: [["    dormant: true\n", ""]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E031] }
  - id: e031-dormant-on-non-outsource
    replace:
      team/twins/qa-manager.md: [["    category: create\n", "    category: create\n    dormant: true\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E004] }
  - id: outsource-opt-in-ok
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: chair-head, reason: 測試, reviewBy: \"2026-11-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 0, codes: [W003], contains: ["outsource: enabled 1 / dormant 0"] }
  - id: e032-missing-field
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: chair-head, reviewBy: \"2026-11-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E032, W003] }
  - id: e032-approver-not-in-escalation
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: ghost-head, reason: 測試, reviewBy: \"2026-11-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E032, W003] }
  - id: e032-approver-is-own-position
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: qa-manager, reason: 測試, reviewBy: \"2026-11-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E032, W003] }
  - id: e032-capability-not-outsource
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: ncr-triage, approvedBy: chair-head, reason: 測試, reviewBy: \"2026-11-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E032, W003] }
  - id: e033-review-beyond-90-days
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: chair-head, reason: 測試, reviewBy: \"2027-03-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E033, W003] }
  - id: e033-expired-is-warning-in-ci
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: chair-head, reason: 測試, reviewBy: \"2026-09-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 0, codes: [E033, W003] }
  - id: e033-expired-is-error-in-strict
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: chair-head, reason: 測試, reviewBy: \"2026-09-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --strict]
    expect: { exit: 1, codes: [E033, W003] }
  - id: w002-review-due-within-14-days
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: chair-head, reason: 測試, reviewBy: \"2026-10-15\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 0, codes: [W002, W003] }
  - id: e034-two-enabled-outsource
    replace:
      team/roster.example.yaml: [["reviewedOn: \"2026-09-20\" }\n", "reviewedOn: \"2026-09-20\" }\n      enableOutsource:\n        - { capability: 8d-formatting, approvedBy: chair-head, reason: 測試, reviewBy: \"2026-11-01\", manualRepsPerMonth: 2 }\n        - { capability: 8d-formatting, approvedBy: chair-head, reason: 再一次, reviewBy: \"2026-11-01\", manualRepsPerMonth: 2 }\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E034, W003] }
  - id: e035-no-strengthen-or-create
    replace:
      team/twins/qa-manager.md: [["    category: strengthen\n", "    category: outsource\n    dormant: true\n"], ["    category: create\n", "    category: outsource\n    dormant: true\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E035] }
  - id: e036-outsource-autonomy-above-draft
    replace:
      team/twins/qa-manager.md: [["    autonomy: draft\n", "    autonomy: act\n"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E036, W001] }
  - id: e037-missing-today
    replace:
      team/twins/qa-manager.md: [["    today: 品保工程師人工翻查\n", ""]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E037] }
  - id: e037-missing-human-still-does
    replace:
      team/twins/qa-manager.md: [["    humanStillDoes: 先寫下嚴重度與理由\n", ""]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E037] }
  - id: e038-strengthen-only-review
    replace:
      team/twins/qa-manager.md: [["humanStillDoes: 先寫下嚴重度與理由", "humanStillDoes: 審閱後確認"]]
    args: [check, --ci]
    expect: { exit: 1, codes: [E038] }
