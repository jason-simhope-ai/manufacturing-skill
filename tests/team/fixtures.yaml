# Fixtures for tests/team/run.py (spec section 18, WP2).
#
# Every case is {id, files, replace, copy, git, args, expect}:
#   - the runner writes `base:` into a temp mini repo, then applies the case:
#       files:   {path: content | null}      add / overwrite / delete a file
#       copy:    {dst: src}                  copy an existing mini-repo file
#       replace: {path: [[old, new], ...]}   exact string edits (old must exist)
#       git: true                            `git init && git add -f -A` first
#   - `args` is the teamctl command line (the runner prepends --repo-root and
#     adds --today 2026-10-05 to `check` unless given)
#   - expect.exit is the exit code; expect.codes is the EXACT set of E/W codes
#     printed (errors and warnings); expect.contains lists output substrings.
#
# Placeholders expanded by the runner (so this file never contains a literal
# token, name or id that the repo scanners would flag):
#   @@PAD:n@@  n filler characters          @@SLACK_TOKEN@@  @@AWS_KEY@@
#   @@EMAIL@@  @@MOBILE@@  @@SLACK_ID@@  @@DISCORD_ID@@  @@ZH_NAME@@
#   @@HONORIFIC@@  @@GEN:CHANNELS:n@@  @@GEN:ALIASES:n@@
#
# Codes covered here: every E/W code in CODES except E051 (needs a patched
# build; see tests/team/test_team.py::test_e051_nondeterministic_build).

base:
  plugin.json: |
    {"name": "t", "version": "0", "profiles": {"available": ["cnc-machining", "injection-molding"]}}
  .gitignore: |
    team/local/*
    !team/local/README.md
    !team/local/.gitkeep
    team/.build/
    *.local.yaml
    *.local.md
    logs/
    **/audit/
    **/memory/
  TEAM.md: |
    # TEAM
    fixture entry file
  team/policies/core-rules.md: |
    # core rules
    fixture rules
  team/policies/restricted.md: |
    # restricted
    fixture policy
  team/gate/need-a-twin.md: |
    # gate
    fixture gate
  core/agents/quality-inspector.md: |
    ---
    name: quality-inspector
    description: fixture QC agent
    model: sonnet
    ---

    # QC

    fixture body
  core/skills/spc-basics.md: |
    ---
    name: spc-basics
    description: fixture SPC skill
    ---

    body
  core/know-how/iso-9001.md: |
    ---
    title: fixture ISO
    ---

    body
  core/hooks/on-error.md: |
    ---
    name: on-error
    trigger: x
    ---

    body
  profiles/cnc-machining/agents/cnc-programmer.md: |
    ---
    name: cnc-programmer
    description: fixture profile agent
    model: sonnet
    ---

    body
  profiles/injection-molding/agents/mold-designer.md: |
    ---
    name: mold-designer
    description: fixture profile agent
    model: sonnet
    ---

    body
  team/roster.example.yaml: |
    schema: 1
    synthetic: true
    org: { id: test-co, displayName: 測試公司, timezone: Asia/Taipei }
    profiles: [cnc-machining]
    policy: { saasTierCeiling: T1, cloudTierCeiling: T1, autonomyCeiling: draft, channelWindow: 10 }
    departments:
      - { id: qa, title: 品保部, head: qa-manager, escalation: [qa-manager, chair-head] }
      - { id: chair, title: 董事長室, head: chair-head, escalation: [chair-head] }
    positions:
      - id: qa-manager
        department: qa
        title: 品保部主管
        incumbent: LOCAL
        twin:
          enabled: true
          file: qa-manager
          autonomyCeiling: draft
          needsTwinGate: { result: twin, rationale: 測試, reviewedOn: "2026-09-20" }
      - { id: chair-head, department: chair, title: 董事長室主管, incumbent: LOCAL }
    channels:
      - { id: qa-floor, department: qa, tier: T1, adapter: mock, twins: [qa-manager], defaultTwin: qa-manager, autonomyCeiling: draft, askers: [qa-manager] }
  team/twins/qa-manager.md: |
    ---
    kind: twin
    schemaVersion: 1
    id: qa-manager
    title: 品保部主管分身
    department: qa
    description: NCR 分流的副駕；判定永遠交還品保部主管
    tierCeiling: T1
    autonomyCeiling: draft
    decisionRights: [不良判定]
    compose: { agent: quality-inspector, skills: [spc-basics], knowHow: [iso-9001], hooks: [on-error], optional: [] }
    capabilities:
      - id: ncr-triage
        summary: 人先判嚴重度，分身補相似案
        category: strengthen
        autonomy: suggest
        today: 品保工程師人工翻查
        humanStillDoes: 先寫下嚴重度與理由
        decisionPoints: [嚴重度最終判定]
      - id: spc-watch
        summary: 每日掃描 SPC
        category: create
        autonomy: suggest
        today: 無人定期做
        humanStillDoes: 決定是否加嚴抽樣
        decisionPoints: [是否加嚴抽樣]
      - id: 8d-formatting
        summary: 排版 8D
        category: outsource
        autonomy: draft
        dormant: true
        today: 品保工程師手動排版
        humanStillDoes: 逐段核對後才送出
        decisionPoints: [是否送出]
    schedule:
      - { capability: spc-watch, cron: "50 7 * * 1-5", channel: qa-floor }
    ---

    ## 角色定位

    測試用。

    ## 你會做的事

    - 補相似案。

    ## 決策點（永遠交還人類）

    不良判定。

    ## 你不會做的事

