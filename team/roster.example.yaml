# 範例 roster（synthetic、虛構）：部門、職稱與 id 都只是範例，不描述任何真實公司。
# 請整份改成貴公司自己的部門與職稱（id、title、channels 都要換），不要直接沿用。
# 真實 roster 請放 team/local/roster.local.yaml（gitignored）；規則見 team/README.zh-TW.md。
schema: 1
synthetic: true
org: { id: example-machinery-co, displayName: 範例製造公司（虛構）, timezone: Asia/Taipei }
profiles: [cnc-machining]   # 範例：換成貴公司安裝的 profile（見 profiles/）；分身檔引用的 agent 要在 core 或這些 profile 裡找得到（teamctl check 會查，E023）
policy: { saasTierCeiling: T1, cloudTierCeiling: T1, autonomyCeiling: draft, channelWindow: 10 }
departments:
  - { id: engineering, title: 技術部, head: engineering-manager, escalation: [engineering-manager, chair-head] }
  - { id: qa, title: 品保部, head: qa-manager, escalation: [qa-manager, chair-head] }
  - { id: production, title: 生產部, head: production-manager, escalation: [production-manager, chair-head] }
  - { id: machining, title: 加工部, head: machining-manager, escalation: [machining-manager, chair-head] }
  - { id: sales, title: 業務部, head: sales-manager, escalation: [sales-manager, chair-head] }
  - { id: admin, title: 管理部, head: admin-manager, escalation: [admin-manager, chair-head] }
  - { id: chair, title: 董事長室, head: chair-head, escalation: [chair-head] }
positions:
  - id: engineering-manager
    department: engineering
    title: 技術部主管
    incumbent: LOCAL
    twin:
      enabled: false
      file: engineering-manager
      autonomyCeiling: draft
      needsTwinGate:
        result: defer
        rationale: ECN 表單與 BOM where-used 尚未數位化（G2、G5 未通過），先做流程修正
        reviewedOn: "2026-10-05"
  - id: qa-manager
    department: qa
    title: 品保部主管
    incumbent: LOCAL
    twin:
      enabled: true
      file: qa-manager
      autonomyCeiling: draft
      needsTwinGate:
        result: twin
        rationale: NCR 翻查與 8D 檢查每週約 6 小時（合成例：品保工程師 4、主管 2）；品保工程師已訪談；NCR 匯出已在來源端去識別
        reviewedOn: "2026-10-05"
  - id: production-manager
    department: production
    title: 生產部主管
    incumbent: LOCAL
    twin:
      enabled: true
      file: production-manager
      autonomyCeiling: draft
      needsTwinGate:
        result: twin
        rationale: 晨會資料整理每天約 40 分鐘、每週約 3.5 小時（合成例）；生管已訪談；排程資料已數位化
        reviewedOn: "2026-10-05"
  - { id: qa-inspector, department: qa, title: 品保檢驗員, incumbent: LOCAL }
  - { id: machining-manager, department: machining, title: 加工部主管, incumbent: LOCAL }
  - { id: sales-manager, department: sales, title: 業務部主管, incumbent: VACANT }
  - { id: admin-manager, department: admin, title: 管理部主管, incumbent: LOCAL }
  - { id: chair-head, department: chair, title: 董事長室主管, incumbent: LOCAL }
channels:
  - { id: qa-floor, department: qa, tier: T1, adapter: mock, twins: [qa-manager], defaultTwin: qa-manager, autonomyCeiling: draft, askers: [qa-manager], twinFreeDays: [15] }
  # learners: may @ the twin, get only similar cases and counter-examples (never a verdict);
  # their turns stay out of the channel window. Keep the manager out of this channel.
  - { id: qa-learn, department: qa, tier: T1, adapter: mock, twins: [qa-manager], defaultTwin: qa-manager, autonomyCeiling: suggest, askers: [], learners: [qa-inspector], predictFirstDefault: true }
  - { id: production-floor, department: production, tier: T1, adapter: mock, twins: [production-manager], defaultTwin: production-manager, autonomyCeiling: draft, askers: [production-manager] }
  - { id: daily-ops, department: production, tier: T1, adapter: mock, twins: [production-manager, qa-manager], defaultTwin: production-manager, autonomyCeiling: draft, askers: [production-manager, qa-manager, machining-manager] }
